[build]
  publish = "."
  command = ""

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  DISABLE_FRAMEWORK_DETECTION = "true"

[[redirects]]
  from = "/@vite/*"
  to = "/@vite/client"
  status = 200

[[redirects]]
  from = "/@id/*"
  to = "/404-not-found-static"
  status = 404

[[redirects]]
  from = "/*.js"
  to = "/404-not-found-static"
  status = 404

[[redirects]]
  from = "/*.css"
  to = "/404-not-found-static"
  status = 404

[[redirects]]
  from = "/*.map"
  to = "/404-not-found-static"
  status = 404

[[redirects]]
  from = "/*.ts"
  to = "/404-not-found-static"
  status = 404
  force = true

[[redirects]]
  from = "/*.tsx"
  to = "/404-not-found-static"
  status = 404
  force = true

[[redirects]]
  from = "/*.woff"
  to = "/404-not-found-static"
  status = 404

[[redirects]]
  from = "/*.woff2"
  to = "/404-not-found-static"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/@vite/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-store"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
